services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf_dev_password
      POSTGRES_DB: bookleaf
    ports:
      - "5432:5432"
    volumes:
      - bookleaf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf -d bookleaf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookleaf-postgres-data:
